name: Build coop

on:
    workflow_dispatch:
    push:
        branches: [ dev ]
    pull_request:
        branches: [ dev ]

jobs:
    build:
        if: ${{ (github.event_name != 'push' || contains(github.event.head_commit.message, '[build]')) && github.event.pull_request.draft == false }}
        strategy:
          matrix:
            platform:
              - name: Windows
                os: windows-latest
                shell: msys2 {0}
                exe: .exe
                zip: dynos lang mods palettes coop.map discord_game_sdk.dll sm64coopdx.exe coopdx_updater.exe

              - name: [Linux, SteamOS]
                os: ubuntu-22.04
                deps: |
                  sudo apt update
                  sudo apt install -y build-essential git python3 libglew-dev libsdl2-dev libz-dev libcurl4-openssl-dev zip
                zip: dynos lang mods palettes libdiscord_game_sdk.so sm64coopdx coopdx_updater

              - name: macOS_ARM
                os: macos-26
                deps: brew install make mingw-w64 pkg-config glfw3 coreutils
                make: |
                  export PKG_CONFIG_PATH=/opt/homebrew/lib/pkgconfig:$PKG_CONFIG_PATH
                  gmake OSX_BUILD=1 -j$(sysctl -n hw.ncpu)
                internal: .app/Contents/MacOS/sm64coopdx
                zip: sm64coopdx.app

              - name: macOS_Intel
                os: macos-15-intel
                deps: brew install make mingw-w64 pkg-config glfw3 coreutils
                make: gmake OSX_BUILD=1 -j$(sysctl -n hw.ncpu)
                internal: .app/Contents/MacOS/sm64coopdx
                zip: sm64coopdx.app
            include:
              - platform:
                  - make: make -j$(nproc)
                
        name: ${{ matrix.plat.name }}
        runs-on: ${{ matrix.plat.os }}
        defaults:
            run:
                shell: ${{ matrix.plat.shell }}

        steps:
            - name: Checkout repository
              uses: actions/checkout@v7
              with:
                persist-credentials: false

            - name: Install MSYS2
              if: ${{ matrix.plat.name == 'Windows' }}
              uses: msys2/setup-msys2@v2
              with:
                msystem: mingw64
                update: true
                install: >
                    unzip
                    make
                    git
                    mingw-w64-x86_64-gcc
                    mingw-w64-x86_64-glew
                    mingw-w64-x86_64-SDL2
                    python3
                    zip

            - name: Install dependencies
              if: ${{ matrix.plat.name != 'Windows' }}
              run: ${{ matrix.plat.deps }}

            - name: Build the game
              run: ${{ matrix.plat.make }} ${{ case(matrix.plat.name == 'SteamOS', 'HANDHELD=1', '') }}

            - name: Code sign the app (Ad-Hoc)
              if: ${{ contains(matrix.plat.name, 'macOS') }}
              run: |
                codesign --force --deep --sign - ./build/us_pc/sm64coopdx.app

            - name: Generate hash
              run: |
                cd tools
                g++ -std=c++17 -o hash_file${{ matrix.plat.exe }} hash_file.cpp
                echo "::notice ::$(./hash_file${{ matrix.plat.exe }} ../build/us_pc/sm64coopdx${{ matrix.plat.exe }}${{ matrix.plat.internal }})"

            - name: Zip the game
              run: |
                cd ./build/us_pc
                zip -r sm64coopdx_${{ matrix.plat.name }}.zip ${{ matrix.plat.zip }}

            - name: Upload artifact
              uses: actions/upload-artifact@v7
              with:
                path: ./build/us_pc/sm64coopdx_${{ matrix.plat.name }}.zip
                archive: false
